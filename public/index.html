<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>%WEB_TITLE%</title>
    <!-- Home Screen app (iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Paced" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #F2F2F7; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      @media (prefers-color-scheme: dark) { body { background: #000; } }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea { font-size: 16px; } /* stops iPhone zooming in on focus */
    </style>
  </head>
  <body>
    <noscript>Paced needs JavaScript.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
