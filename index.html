<html lang="en">
  <head>

    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #F2F2F7; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      @media (prefers-color-scheme: dark) { body { background: #000; } }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea { font-size: 16px; } /* stops iPhone zooming in on focus */

      /* Font picker (Settings → Appearance). Icons set their own font inline, so they're left alone. */
      @font-face {
        font-family: 'InterVariable';
        src: url('./fonts/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      body[data-font='inter'] [dir='auto']:not([style*='font-family']),
      body[data-font='inter'] input, body[data-font='inter'] textarea {
        font-family: 'InterVariable', -apple-system, system-ui, sans-serif !important;
        font-feature-settings: 'cv11', 'ss01';
      }
      body[data-font='serif'] [dir='auto']:not([style*='font-family']),
      body[data-font='serif'] input, body[data-font='serif'] textarea {
        font-family: 'New York', ui-serif, Georgia, serif !important;
      }
      body[data-font='mono'] [dir='auto']:not([style*='font-family']),
      body[data-font='mono'] input, body[data-font='mono'] textarea {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace !important;
        letter-spacing: -0.2px;
      }
    </style>
  <meta name="theme-color" content="#4F46E5">
<meta name="description" content="To-do list that plans your deadlines around your calendar">
<link rel="icon" href="/paced/favicon.ico"/></head>
  <body>
    <noscript>Paced needs JavaScript.</noscript>
    <div id="root"></div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;padding:60px 24px;font:16px -apple-system,system-ui,sans-serif;color:#f4f4f6;background:#000;z-index:9999">
      <div style="font-size:22px;font-weight:800;margin-bottom:12px">Paced didn't start</div>
      <div id="boot-error-msg" style="white-space:pre-wrap;color:#a1a1aa;font-size:14px;margin-bottom:20px"></div>
      <button onclick="location.replace(location.pathname)" style="font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:12px;background:#818cf8;color:#0b0b12">Reload</button>
    </div>
    <script>
      (function () {
        var errors = [];
        function show(extra) {
          var root = document.getElementById('root');
          if (root && root.children.length && !extra) return;
          document.getElementById('boot-error-msg').textContent =
            (errors.length ? errors.join('\n') : 'It took too long to load. Check your connection and tap Reload.') +
            '\n\nSend a screenshot of this to get it fixed.';
          document.getElementById('boot-error').style.display = 'block';
        }
        window.addEventListener('error', function (e) {
          errors.push((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
          var root = document.getElementById('root');
          if (!root || !root.children.length) show(true);
        });
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('Promise: ' + (e.reason && (e.reason.message || e.reason)));
        });
        setTimeout(function () { show(false); }, 12000);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  <script src="/paced/_expo/static/js/web/index-e91b921e5b79aab0c151b190317d7100.js" defer></script>
</body>
</html>
